[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "intelligent-cloud-observability-platform"
version = "1.0.0"
description = "AI-powered cloud observability platform featuring scikit-learn anomaly detection, OpenTelemetry collector, incident simulator, and AI Reliability Agent"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Sham Satish Thakare" }]
dependencies = [
  "fastapi>=0.110.0",
  "numpy>=1.26.0",
  "opentelemetry-api>=1.23.0",
  "opentelemetry-sdk>=1.23.0",
  "prometheus-client>=0.20.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "python-multipart>=0.0.9",
  "scikit-learn>=1.4.0",
  "uvicorn[standard]>=0.28.0",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "mypy>=1.9.0",
  "pytest>=8.1.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/icop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["icop"]
mypy_path = "src"
